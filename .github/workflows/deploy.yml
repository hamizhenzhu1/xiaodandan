name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code
        run: |
          pnpm lint
          pnpm test

      - name: Build website
        env:
          VITE_SUPABASE_URL: https://jxodkmhyonghegeewktv.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_O7aQVizfWohwmuACCgYWbQ_fwdqmT4A
        run: |
          pnpm exec tsc -b
          pnpm exec vite build --base=/xiaodandan/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
